# 配置缓存：跳过未变化的配置阶段，加快增量构建
org.gradle.configuration-cache=true

# AGP 9 内置 Kotlin 默认禁止 kotlin.sourceSets DSL；KSP 仍用它注册生成的源码目录，
# 不放行会在配置期报 "Using kotlin.sourceSets DSL ... not allowed with built-in Kotlin"（必需）
android.disallowKotlinSourceSets=false
# 压制上面实验性选项触发的 AGP 警告
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# Gradle daemon JVM 内存（默认 512m/384m 对 AGP9+Kotlin2+13 模块太小，会 Metaspace 耗尽崩溃）
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
