name: GazeLab
options:
  deploymentTarget: {iOS: "16.0"}
  xcodeVersion: "26.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "9"
    TARGETED_DEVICE_FAMILY: "1"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/build/mnn-source/include"
    LIBRARY_SEARCH_PATHS: "$(inherited) $(SRCROOT)/build/mnn-device"
    OTHER_LDFLAGS: "$(inherited) -force_load $(SRCROOT)/build/mnn-device/libMNN.a -lc++"
    SWIFT_OBJC_BRIDGING_HEADER: Sources/GazeMNN.h
targets:
  GazeLab:
    type: application
    platform: iOS
    sources:
      - Sources
      - ../../../core/designsystem/ios/CornealLabStyle.swift
      - Resources/Assets.xcassets
      - path: WebEyeTrack-LICENSE.txt
        buildPhase: resources
      - path: ../../../core/camera/src/main/assets/face_landmarker.task
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: GazeLab
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSCameraUsageDescription: 在本机使用前置摄像头对比不同模型的屏幕注视点。
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zkyjss.gazelab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    scheme: {}
