name: 斜视光码科研实验室 iOS IPA
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - "feat/strabismus-lab*"
    paths:
      - ".github/workflows/strabismus-lab-ios.yml"
      - "experiments/StrabismusLab/ios/**"
      - "shared/**"
      - "core/camera/src/main/assets/face_landmarker.task"
permissions:
  contents: read
concurrency:
  group: strabismus-lab-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-ipa:
    name: 构建并核验未签名真机 IPA
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: iosApp
          bundler-cache: true
      - run: chmod +x gradlew
      - name: 共享核心单测与 Swift 语法预检
        run: |
          set -euo pipefail
          python3 scripts/ios/check_project.py
          ./gradlew -p shared :model:jvmTest :domain:jvmTest :screening:jvmTest
          swiftc -frontend -parse experiments/StrabismusLab/ios/Sources/*.swift experiments/StrabismusLab/ios/Tests/*.swift
      - run: brew install xcodegen
      - name: 生成独立 Xcode 工程并安装 Pods
        working-directory: experiments/StrabismusLab/ios
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          BUNDLE_GEMFILE="$GITHUB_WORKSPACE/iosApp/Gemfile" bundle exec pod install
      - name: 构建并核验未签名真机 IPA
        working-directory: experiments/StrabismusLab/ios
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build -workspace StrabismusLab.xcworkspace -scheme StrabismusLab -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/Device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build/xcodebuild.log 2>&1 \
            || { tail -n 160 build/xcodebuild.log; exit 1; }
          app=build/Device/Build/Products/Release-iphoneos/StrabismusLab.app
          test "$(xcrun lipo -archs "$app/StrabismusLab")" = arm64
          test -s "$app/face_landmarker.task"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = com.zkyjss.strabismuslab
          test "$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$app/Info.plist")" = iphoneos
          test ! -e "$app/_CodeSignature"
          test ! -e "$app/embedded.mobileprovision"
          mkdir -p build/unsigned/Payload
          cp -R "$app" build/unsigned/Payload/
          cd build/unsigned
          zip -qry StrabismusLab-v0.9.1-unsigned.ipa Payload
          shasum -a 256 StrabismusLab-v0.9.1-unsigned.ipa > SHA256.txt
          ls -lh StrabismusLab-v0.9.1-unsigned.ipa SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: strabismus-lab-unsigned-ipa
          path: |
            experiments/StrabismusLab/ios/build/unsigned/StrabismusLab-v0.9.1-unsigned.ipa
            experiments/StrabismusLab/ios/build/unsigned/SHA256.txt
          if-no-files-found: error
          retention-days: 14
