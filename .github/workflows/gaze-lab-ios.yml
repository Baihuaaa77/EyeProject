name: 屏幕注视追踪 iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [codex/gaze-lab-ios]
permissions:
  contents: read
concurrency:
  group: gaze-lab-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-ipa:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: "26.4"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
      - uses: ruby/setup-ruby@v1
        with: {ruby-version: "3.3", working-directory: iosApp, bundler-cache: true}
      - name: 检查工程并运行共用算法回归
        run: |
          chmod +x gradlew
          python3 scripts/ios/check_project.py
          ./gradlew -p shared :domain:jvmTest
      - run: brew install xcodegen
      - name: 生成独立工程
        working-directory: experiments/GazeLab/ios
        run: |
          xcodegen generate --spec project.yml
          BUNDLE_GEMFILE="$GITHUB_WORKSPACE/iosApp/Gemfile" bundle exec pod install
      - name: 构建并核验未签名真机 IPA
        working-directory: experiments/GazeLab/ios
        run: |
          set -euo pipefail
          xcodebuild build -workspace GazeLab.xcworkspace -scheme GazeLab -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/Device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          app=build/Device/Build/Products/Release-iphoneos/GazeLab.app
          test "$(xcrun lipo -archs "$app/GazeLab")" = arm64
          test -s "$app/face_landmarker.task"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = com.zkyjss.gazelab
          test "$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$app/Info.plist")" = iphoneos
          test ! -e "$app/_CodeSignature"
          test ! -e "$app/embedded.mobileprovision"
          mkdir -p build/unsigned/Payload
          cp -R "$app" build/unsigned/Payload/
          cd build/unsigned
          zip -qry GazeLab-v0.1.0-build1-unsigned.ipa Payload
          shasum -a 256 GazeLab-v0.1.0-build1-unsigned.ipa > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gaze-lab-ios-unsigned-ipa
          path: |
            experiments/GazeLab/ios/build/unsigned/GazeLab-v0.1.0-build1-unsigned.ipa
            experiments/GazeLab/ios/build/unsigned/SHA256.txt
          if-no-files-found: error
          retention-days: 14
