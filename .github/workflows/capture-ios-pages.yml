name: iPhone 页面逐张截图
on:
  workflow_dispatch:
  push:
    branches: [codex/iphone-captures-20261111]
permissions:
  contents: read
concurrency:
  group: iphone-page-captures-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: "26.4"}
      - uses: gradle/actions/setup-gradle@v4
      - uses: ruby/setup-ruby@v1
        with: {ruby-version: "3.3", working-directory: iosApp, bundler-cache: true}
      - run: brew install xcodegen
      - name: 渲染浅色与深色页面及各测试状态
        env:
          EYE_SCREENSHOT_CAPTURE: "1"
        run: chmod +x gradlew scripts/ios/verify.sh && ./scripts/ios/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-page-captures
          path: iosApp/build/page-captures/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: iphone-capture-diagnostics
          path: iosApp/build/*.xcresult
