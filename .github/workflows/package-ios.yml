name: 手动生成签名 iOS 测试包
on:
  workflow_dispatch:
    inputs:
      distribution:
        description: 描述文件必须匹配所选分发方式
        type: choice
        default: testflight
        options: [testflight, adhoc]
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      IOS_DISTRIBUTION: ${{ inputs.distribution }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: 检查签名配置
        run: |
          test -n "$APPLE_TEAM_ID" && test -n "$IOS_BUNDLE_ID" && test -n "$IOS_CERTIFICATE_BASE64" && test -n "$IOS_PROFILE_BASE64" || {
            echo '请先在仓库 Secrets 配置苹果团队、Bundle ID、证书和描述文件。'; exit 1;
          }
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: "26.4"}
      - uses: gradle/actions/setup-gradle@v4
      - uses: ruby/setup-ruby@v1
        with: {ruby-version: "3.3", working-directory: iosApp, bundler-cache: true}
      - run: brew install xcodegen
      - name: 检查共用规则和工程
        run: |
          python3 scripts/ios/check_project.py
          chmod +x gradlew scripts/ios/*.sh
          ./gradlew -p shared :domain:jvmTest :screening:jvmTest
      - name: 配置临时签名环境
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/eye-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/eye-signing.p12"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/eye-profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/eye-signing.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/eye-profile.mobileprovision" > "$RUNNER_TEMP/eye-profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/eye-profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/eye-profile.plist")
          PROFILE_APP=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/eye-profile.plist")
          test "$PROFILE_APP" = "$APPLE_TEAM_ID.$IOS_BUNDLE_ID" || { echo '描述文件与应用标识不匹配'; exit 1; }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/eye-profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          printf 'IOS_PROFILE_NAME=%s\n' "$PROFILE_NAME" >> "$GITHUB_ENV"
          printf 'IOS_EXPORT_OPTIONS_PLIST=%s\n' "$RUNNER_TEMP/eye-export.plist" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, plistlib
          with open(os.environ['RUNNER_TEMP']+'/eye-profile.plist','rb') as source:
              name=plistlib.load(source)['Name']
          config={'method':'app-store-connect' if os.environ['IOS_DISTRIBUTION']=='testflight' else 'release-testing',
                  'teamID':os.environ['APPLE_TEAM_ID'],'signingStyle':'manual','signingCertificate':'Apple Distribution',
                  'provisioningProfiles':{os.environ['IOS_BUNDLE_ID']:name},'uploadSymbols':True,
                  'manageAppVersionAndBuildNumber':False}
          with open(os.environ['RUNNER_TEMP']+'/eye-export.plist','wb') as output:
              plistlib.dump(config,output)
          PY
      - name: 构建并导出 IPA（不会自动发布）
        run: ./scripts/ios/archive.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.distribution }}-ipa
          path: iosApp/build/export/*.ipa
          if-no-files-found: error
